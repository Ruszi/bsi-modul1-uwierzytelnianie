{% extends "base.html" %}  {# dziedziczy wygląd z base.html #}
{% block title %}Logowanie{% endblock %}

{% block content %}
<section class="card">
  <h1>Logowanie</h1>
  <form method="post">
    <!-- Ukryty token CSRF: dowód, że formularz pochodzi z naszej strony -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Login
      <input type="text" name="login" value="{{ login }}" autocomplete="username" autofocus required>
    </label>

    <!-- type="password" = hasło zamaskowane kropkami -->
    <label>Hasło
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button class="btn btn-primary" type="submit">Zaloguj</button>
  </form>
</section>
{% endblock %}
